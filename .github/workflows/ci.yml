# eshop-web's CI (ADR 0009; pkhamdee/modernapp's docs/git-workflow.md, "Service repositories").
#   - pull request to main or release/*  -> lint and build, then the shared gates' SAST and dependency scan
#   - push to main                       -> also the image: built, run in the temporary copy beside the other
#                                           services' newest main images, gated, scanned, then pushed as
#                                           docker.io/pkhamdee/eshop-web:main-<sha>-<ts> (Flux deploys it to dev)
#   - push to release/N.x                -> the same, pushed as release-N.x-<sha> (a patch's image)
#   - workflow_dispatch on main or release/N.x -> rebuilds and pushes that branch's image the same way
# The gates are pkhamdee/modernapp's .github/workflows/service-image.yml. The jobs a pull request runs are main's
# required checks, by name: renaming one means re-running pkhamdee/modernapp's scripts/protect-main.sh.
name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: eshop-web (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build

  image:
    name: image
    needs: [lint]
    uses: pkhamdee/modernapp/.github/workflows/service-image.yml@main
    with:
      images: '[{"service": "eshop-web", "context": ".", "dockerfile": "Dockerfile"}]'
